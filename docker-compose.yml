name: openclaw

services:
  gateway:
    image: ${OPENCLAW_IMAGE:?set OPENCLAW_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      # Config comes from this repo and OpenClaw must not rewrite it. Runtime
      # state (sessions, pairing, plugins) lives in the state volume instead.
      # STATE_DIR is set explicitly so OpenClaw doesn't derive it from the
      # read-only config directory.
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_CONFIG_READONLY: "1"
      OPENCLAW_STATE_DIR: /home/node/.openclaw
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - state:/home/node/.openclaw
      - ./config:/etc/openclaw:ro
      - ./workspace:/home/node/.openclaw/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  state:
