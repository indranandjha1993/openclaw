services:
  cert-init:
    image: alpine/openssl:latest
    container_name: openclaw-cert-init
    volumes:
      - ./certs:/certs
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /certs/openclaw.crt ]; then
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
            -keyout /certs/openclaw.key \
            -out /certs/openclaw.crt \
            -subj "/CN=openclaw-gateway.openclaw.orb.local" \
            -addext "subjectAltName=DNS:openclaw-gateway.openclaw.orb.local,DNS:localhost"
          echo "Certificate generated."
        else
          echo "Certificate already exists, skipping."
        fi

  openclaw-gateway:
    image: nginx:alpine
    container_name: openclaw-gateway
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      openclaw-backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  openclaw-backend:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-backend
    restart: unless-stopped
    expose:
      - "18789"
      - "18790"
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=true
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY}
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-cli
    depends_on:
      openclaw-backend:
        condition: service_healthy
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY}
      - BROWSER=echo
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    profiles:
      - cli
