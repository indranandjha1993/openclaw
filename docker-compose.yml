name: openclaw

services:
  gateway:
    image: ${OPENCLAW_IMAGE:?set OPENCLAW_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      # Config comes from this repo and OpenClaw must not rewrite it. Runtime
      # state (sessions, pairing, plugins) lives in the state volume instead.
      # STATE_DIR is set explicitly so OpenClaw doesn't derive it from the
      # read-only config directory.
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_CONFIG_READONLY: "1"
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      # OpenClaw's own bundled code still calls SDK functions it has marked
      # deprecated; nothing in this setup can fix that, so hide just that code.
      NODE_OPTIONS: --disable-warning=DEP_PLUGIN_SDK
      NODE_COMPILE_CACHE: /var/tmp/openclaw-compile-cache
      # Docker's restart policy is the supervisor; restart in place instead.
      OPENCLAW_NO_RESPAWN: "1"
    # Host networking lets the gateway bind 127.0.0.1 and still be reachable
    # from this machine, instead of listening on 0.0.0.0 inside the container.
    network_mode: host
    volumes:
      - state:/home/node/.openclaw
      - ./config:/etc/openclaw:ro
      - ./workspace:/home/node/.openclaw/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${OPENCLAW_GATEWAY_PORT:-18789}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  state:
